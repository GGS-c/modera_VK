<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Medora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<nav class="p-6 shadow">
    <a href="../index.html" class="text-2xl font-bold">MEDORA.</a>
</nav>

<section class="bg-[#102A43] text-white py-24 text-center">
    <h1 class="text-5xl">Let's Connect</h1>
    <p class="mt-5">Start your medical education journey with us.</p>
</section>

<section class="max-w-7xl mx-auto px-6 py-20 grid md:grid-cols-2 gap-16">

    <div>

        <h2 class="text-4xl text-[#102A43]">
            Get In Touch
        </h2>

        <p class="text-gray-500 mt-5">
            Have questions about medical education opportunities?
            Contact our team.
        </p>

        <div class="mt-10 space-y-6">

            <div>
                <h3 class="font-bold">Phone</h3>
                <p class="text-gray-500">+91 XXXXX XXXXX</p>
            </div>

            <div>
                <h3 class="font-bold">Email</h3>
                <p class="text-gray-500">info@example.com</p>
            </div>

            <div>
                <h3 class="font-bold">Office Address</h3>
                <p class="text-gray-500">Your Company Address</p>
            </div>

        </div>

    </div>

    <form id="contactForm" class="p-8 shadow-xl rounded-2xl space-y-5">

        <input required type="text"
            placeholder="Full Name"
            class="w-full p-4 border rounded-xl">

        <input required type="email"
            placeholder="Email Address"
            class="w-full p-4 border rounded-xl">

        <input required type="tel"
            placeholder="Phone Number"
            class="w-full p-4 border rounded-xl">

        <select class="w-full p-4 border rounded-xl">
            <option value="">Interested Country</option>
            <option>Russia</option>
            <option>Georgia</option>
            <option>Kazakhstan</option>
            <option>Uzbekistan</option>
            <option>Philippines</option>
        </select>

        <textarea rows="4"
            placeholder="Your Message"
            class="w-full p-4 border rounded-xl"></textarea>

        <button type="submit"
            class="w-full bg-[#168C88] text-white p-4 rounded-xl font-bold">
            Submit Enquiry
        </button>

        <p id="formMessage" class="text-sm text-gray-500"></p>

    </form>

</section>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (!this.reportValidity()) return;

    document.getElementById("formMessage").innerText =
        "Thank you! This is a demo form. No enquiry was actually sent.";

    this.reset();
});
</script>

<footer class="bg-[#102A43] text-white p-10 text-center">
    © 2026 Medora.
</footer>

</body>
</html>
